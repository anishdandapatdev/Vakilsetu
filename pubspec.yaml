name: advocate_connect
description: "VakilSetu advocate network — UI preview and security foundation."
publish_to: 'none'
version: 0.2.0+2
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  crypto: ^3.0.7
  socket_io_client: ^2.0.3+1
  file_picker: ^10.3.10
dev_dependencies: {}
flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/
    - assets/images/advocates/
    - assets/images/courts/
    - assets/images/navigation/
    - assets/images/chat/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
